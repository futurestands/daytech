    <script>
      (function () {
        try {
          var stored = localStorage.getItem('daytech-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "DayTech Solutions",
        "description": "Uganda-based technology company specialising in software development, IT infrastructure, artificial intelligence, business automation, cloud computing, and digital transformation.",
        "areaServed": ["Uganda", "East Africa", "Africa"],
        "knowsAbout": [
          "Software Development",
          "IT Infrastructure",
          "Artificial Intelligence",
          "Cloud Computing",
          "Cybersecurity",
          "Digital Transformation"
        ]
      }
    </script>

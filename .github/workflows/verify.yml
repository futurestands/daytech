name: DayTech verification
on:
  pull_request:
  push:
    branches: [main, codex/daytech-increment-6]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: bun scripts/check-secrets.ts
      - run: bun scripts/generate-sbom.ts artifacts/daytech-sbom.cdx.json
      - run: bun audit --audit-level high
      - run: bun run lint
      - run: bun run build
      - run: bun run vitest run
      - run: bun run playwright install --with-deps chromium
      - run: npx --yes firebase-tools@15.37.0 emulators:exec --only firestore --project demo-daytech-milestone --config firebase.test.json "bun run vitest run --config vitest.firestore.config.ts && bun run playwright test"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: daytech-sbom
          path: artifacts/daytech-sbom.cdx.json
          if-no-files-found: ignore

name: DayTech verification
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, codex/daytech-increment-6]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DAYTECH_ENV: local
      VITE_FEATURE_FIREBASE: 'false'
      VITE_FEATURE_PAYMENTS: 'false'
      VITE_FEATURE_GOOGLE_CALENDAR: 'false'
      VITE_FEATURE_WHATSAPP: 'false'
      VITE_FEATURE_LIVE_VOICE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: bun scripts/check-secrets.ts
      - run: bun scripts/generate-sbom.ts artifacts/daytech-sbom.cdx.json
      - run: bun audit --audit-level high
      - run: bun run lint
      - run: bun run build
      - run: bun run vitest run
      - run: bun run playwright install --with-deps chromium
      - run: npx --yes firebase-tools@15.37.0 emulators:exec --only firestore --project demo-daytech-milestone --config firebase.test.json "bun run vitest run --config vitest.firestore.config.ts && bun run playwright test"
